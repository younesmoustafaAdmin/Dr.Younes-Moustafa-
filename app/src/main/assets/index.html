<script>
var DB,P=[],A=[],T=1,CUR=null,Q='';
var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function open(){return new Promise(function(ok,no){var r=indexedDB.open('clinic',1);r.onupgradeneeded=function(){r.result.createObjectStore('p',{keyPath:'id'});r.result.createObjectStore('a',{keyPath:'id'})};r.onsuccess=function(){ok(r.result)};r.onerror=no})}
function all(s){return new Promise(function(ok){var q=DB.transaction(s).objectStore(s).getAll();q.onsuccess=function(){ok(q.result)}})}
function rput(s,o){DB.transaction(s,'readwrite').objectStore(s).put(o)}
function rdel(s,id){DB.transaction(s,'readwrite').objectStore(s).delete(id)}
function put(s,o){o.u=Date.now();rput(s,o);push(s,o)}
function del(s,id){rdel(s,id);pdel(s,id)}
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
function tab(n){T=n;CUR=null;SEL=0;draw()}
function td(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function st(p){var c=p.cases||[],d=c.filter(function(x){return x.done}).length;return{d:d,n:c.length-d}}

 document.getElementById('t1').className=T==1?'on':'';document.getElementById('t2').className=T==2?'on':'';document.getElementById('t3').className=T==3?'on':'';
 var v=document.getElementById('v');
 if(T==1&&!CUR){
  var l=P.filter(function(p){return(p.name+p.phone).indexOf(Q)>-1});
  v.innerHTML='<div class="stats"><div><b>'+P.length+'</b>مريض</div><div><b>'+A.filter(function(a){return a.d==td()}).length+'</b>مواعيد اليوم</div><div><b>'+P.reduce(function(s,p){return s+bal(p).r},0)+'</b>مستحقات</div></div><div class="r"><input id="q" placeholder="بحث بالاسم أو الرقم" value="'+E(Q)+'" oninput="Q=this.value;draw();document.getElementById(\'q\').focus()"><button class="p s" onclick="newP()">+ مريض جديد</button></div><div style="height:10px"></div>'+

}
